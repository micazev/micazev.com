<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Subscribers — Michelle Azevedo</title>
    <!-- Emails collected by the /yoga ebook form, read from /api/subscribers.
         Signs in with the GitHub token the CMS at /admin already holds, so
         open the CMS once first; or paste a token with access to
         micazev/micazev-content. -->
    <style>
      :root {
        --ground: #ffffff;
        --ink: #131316;
        --ink-body: #3f3f46;
        --ink-muted: #71717a;
        --ink-faint: #a1a1aa;
        --rule: #e4e4e7;
        --danger: #dc2626;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #131316;
          --ink: #f4f4f5;
          --ink-body: #d4d4d8;
          --ink-muted: #a1a1aa;
          --ink-faint: #71717a;
          --rule: #27272a;
          --danger: #f87171;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        background: var(--ground);
        color: var(--ink);
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 880px; margin-inline: auto; padding: 40px 16px 64px; }
      a { color: inherit; }
      .back { font-size: 13px; color: var(--ink-muted); text-decoration: none; }
      .back:hover { color: var(--ink); }
      .head {
        display: flex; flex-wrap: wrap; align-items: baseline;
        justify-content: space-between; gap: 16px; margin-top: 24px;
      }
      h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
      .count { color: var(--ink-muted); font-weight: 400; margin-left: 6px; }
      .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
      button, .button {
        font: inherit; font-size: 13px; font-weight: 500; line-height: 1;
        padding: 9px 14px; border-radius: 999px; cursor: pointer;
        border: 1px solid var(--rule); background: none; color: var(--ink);
      }
      button:hover { border-color: var(--ink-faint); }
      button.primary { background: var(--ink); border-color: var(--ink); color: var(--ground); }
      button:disabled { opacity: 0.5; cursor: default; }
      input[type="search"], input[type="password"] {
        font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 999px;
        border: 1px solid var(--rule); background: var(--ground); color: var(--ink);
        min-width: 0;
      }
      :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
      .note { margin-top: 16px; color: var(--ink-muted); }
      .error { color: var(--danger); }
      .signin { margin-top: 24px; display: grid; gap: 12px; max-width: 460px; }
      .signin p { color: var(--ink-body); }
      .signin form { display: flex; gap: 8px; }
      .signin input { flex: 1; }
      .table-wrap { margin-top: 24px; overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
      th {
        text-align: left; font-size: 12px; font-weight: 400; letter-spacing: 0.08em;
        text-transform: uppercase; color: var(--ink-faint); padding: 0 12px 8px 0;
        border-bottom: 1px solid var(--rule);
      }
      td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--rule); color: var(--ink-body); white-space: nowrap; }
      td.email { color: var(--ink); font-weight: 500; }
      td:last-child, th:last-child { text-align: right; padding-right: 0; }
      td button { padding: 6px 10px; color: var(--ink-muted); }
      td button:hover { color: var(--danger); border-color: var(--danger); }
      [hidden] { display: none !important; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="/admin/">← Back to the editor</a>

      <div class="head">
        <h1>Subscribers<span class="count" id="count"></span></h1>
        <div class="actions" id="actions" hidden>
          <input type="search" id="filter" placeholder="Filter" aria-label="Filter by email or ebook" />
          <button type="button" id="refresh">Refresh</button>
          <button type="button" class="primary" id="export">Export CSV</button>
        </div>
      </div>

      <section class="signin" id="signin" hidden>
        <p>
          Open <a href="/admin/">the editor</a> and sign in there first, then
          come back. Or paste a GitHub token with access to
          <code>micazev/micazev-content</code>:
        </p>
        <form id="token-form">
          <input type="password" id="token" autocomplete="off" placeholder="github_pat_…" aria-label="GitHub token" required />
          <button type="submit" class="primary">Sign in</button>
        </form>
      </section>

      <p class="note" id="status" role="status"></p>

      <div class="table-wrap" id="table-wrap" hidden>
        <table>
          <thead>
            <tr><th>Email</th><th>Signed up</th><th>Ebook</th><th>Lang</th><th><span class="sr-only">Actions</span></th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </main>

    <script>
      (function () {
        var $ = function (id) { return document.getElementById(id); };
        var subscribers = [];

        // Sveltia keeps the signed-in user, token included, in localStorage
        // on this origin. Look for it rather than hard-coding its key.
        function cmsToken() {
          try {
            for (var i = 0; i < localStorage.length; i++) {
              var key = localStorage.key(i);
              if (!/sveltia|decap|netlify-cms/i.test(key)) continue;
              var value = JSON.parse(localStorage.getItem(key));
              if (value && typeof value.token === "string") return value.token;
            }
          } catch (e) {}
          return null;
        }

        function token() {
          try {
            return sessionStorage.getItem("subscribers-token") || cmsToken();
          } catch (e) {
            return cmsToken();
          }
        }

        function api(path, options) {
          options = options || {};
          options.headers = { Authorization: "Bearer " + token() };
          return fetch(path, options).then(function (res) {
            if (res.status === 401) throw Object.assign(new Error("unauthorized"), { auth: true });
            if (!res.ok) throw new Error("The server answered " + res.status + ".");
            return res;
          });
        }

        function status(text, isError) {
          $("status").textContent = text || "";
          $("status").className = isError ? "note error" : "note";
        }

        function showSignin(message) {
          $("signin").hidden = false;
          $("actions").hidden = true;
          $("table-wrap").hidden = true;
          $("count").textContent = "";
          status(message || "", Boolean(message));
        }

        var dateFormat = new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "short" });

        function render() {
          var q = $("filter").value.trim().toLowerCase();
          var shown = subscribers.filter(function (s) {
            return !q || (s.email + " " + (s.ebook || "")).toLowerCase().indexOf(q) !== -1;
          });
          $("count").textContent = q ? shown.length + " of " + subscribers.length : String(subscribers.length);
          var rows = $("rows");
          rows.textContent = "";
          shown.forEach(function (s) {
            var tr = document.createElement("tr");
            var date = s.createdAt ? dateFormat.format(new Date(s.createdAt)) : "";
            [["email", s.email], ["", date], ["", s.ebook || ""], ["", s.lang || ""]].forEach(function (cell) {
              var td = document.createElement("td");
              if (cell[0]) td.className = cell[0];
              td.textContent = cell[1];
              tr.appendChild(td);
            });
            var td = document.createElement("td");
            var remove = document.createElement("button");
            remove.type = "button";
            remove.textContent = "Remove";
            remove.setAttribute("aria-label", "Remove " + s.email);
            remove.addEventListener("click", function () { removeSubscriber(s.email, remove); });
            td.appendChild(remove);
            tr.appendChild(td);
            rows.appendChild(tr);
          });
          $("table-wrap").hidden = subscribers.length === 0;
          status(subscribers.length === 0 ? "No one has signed up yet." : "");
        }

        function load() {
          if (!token()) return showSignin();
          status("Loading…");
          api("/api/subscribers")
            .then(function (res) { return res.json(); })
            .then(function (body) {
              subscribers = body.subscribers || [];
              $("signin").hidden = true;
              $("actions").hidden = false;
              render();
            })
            .catch(function (error) {
              if (error.auth) {
                try { sessionStorage.removeItem("subscribers-token"); } catch (e) {}
                return showSignin("That token can't read the content repo. Sign in to the editor again, or paste another token.");
              }
              status("Couldn't load subscribers. " + error.message, true);
            });
        }

        function removeSubscriber(email, button) {
          if (!confirm("Remove " + email + " from the list? This can't be undone.")) return;
          button.disabled = true;
          api("/api/subscribers?email=" + encodeURIComponent(email), { method: "DELETE" })
            .then(function () {
              subscribers = subscribers.filter(function (s) { return s.email !== email; });
              render();
            })
            .catch(function (error) {
              button.disabled = false;
              status("Couldn't remove " + email + ". " + error.message, true);
            });
        }

        $("export").addEventListener("click", function () {
          var button = this;
          button.disabled = true;
          api("/api/subscribers?format=csv")
            .then(function (res) {
              var name = (/filename="([^"]+)"/.exec(res.headers.get("Content-Disposition") || "") || [])[1] || "subscribers.csv";
              return res.blob().then(function (blob) { return [blob, name]; });
            })
            .then(function (pair) {
              var a = document.createElement("a");
              a.href = URL.createObjectURL(pair[0]);
              a.download = pair[1];
              document.body.appendChild(a);
              a.click();
              a.remove();
              setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
            })
            .catch(function (error) { status("Couldn't export. " + error.message, true); })
            .then(function () { button.disabled = false; });
        });

        $("refresh").addEventListener("click", load);
        $("filter").addEventListener("input", render);

        $("token-form").addEventListener("submit", function (event) {
          event.preventDefault();
          try { sessionStorage.setItem("subscribers-token", $("token").value.trim()); } catch (e) {}
          $("token").value = "";
          load();
        });

        load();
      })();
    </script>
  </body>
</html>
