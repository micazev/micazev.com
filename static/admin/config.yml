# Sveltia CMS — https://sveltiacms.app/en/docs
#
# Everything here edits github.com/micazev/micazev-content, the private repo
# mounted at content/. A workflow there calls the Vercel deploy hook on every
# push to its main branch, and the site rebuilds from that main.

backend:
  name: github
  repo: micazev/micazev-content
  branch: main

# Saving keeps an entry as a draft: Sveltia commits it to a cms/... branch
# with a pull request, so main and the live site don't change. Publish it
# from the entry (or the Editorial Workflow board) to merge it into main.
# An entry already on main is taken down with its Draft field instead.
# The sign-in token needs Pull requests: Read and write as well as Contents.
publish_mode: editorial_workflow

site_url: https://micazev.com
display_url: https://micazev.com

# Only the Site copy files use these; notes and pages keep their images next
# to the entry (see media_folder on each collection).
media_folder: images
public_folder: /images

# One file per language: notes/<slug>.en.md, notes/<slug>.pt.md.
# src/components/note-html.cjs reads the same layout back.
i18n:
  structure: multiple_files
  locales: [en, pt]
  default_locale: en
  # Write a note in English, Portuguese or both: neither is required. Once
  # published, a workflow in the content repo writes the missing language
  # (.github/scripts/translate.mjs there).
  initial_locales: all

collections:
  # Notes, Tech and Yoga are one folder of notes, split by the section field:
  # it decides which page lists a note (/notes/, /tech/ or /yoga/). Every
  # note lives at /notes/<slug>/ whatever its section. Change the section in
  # the editor to move a note; src/components/note-html.cjs reads it back.
  - &notes
    name: notes
    label: Notes
    label_singular: Note
    description: Listed on micazev.com/notes/.
    folder: notes
    extension: md
    format: frontmatter
    create: true
    i18n: true
    # Notes without a section (older files) belong here too.
    filter: { field: section, value: [notes, null] }
    # The slug is the file name and the URL (/notes/<slug>/). Editable when
    # the note is created, then fixed, so published links don't break.
    slug:
      template: "{{title}}"
      editable: [create]
    media_folder: images
    public_folder: images
    preview_path: /notes/{{slug}}/
    summary: "{{title}} · {{date}}"
    sortable_fields: [date, title]
    fields:
      - &title
        name: title
        label: Title
        widget: string
        i18n: true
        required: false
        hint: "Write in English, Portuguese or both. The missing language is translated after you publish."
      - &date
        name: date
        label: Date
        widget: datetime
        type: date
        format: YYYY-MM-DD
        default: "{{now}}"
        i18n: duplicate
        hint: "Orders the list, newest first. Set an earlier date for posts first published elsewhere."
      - &draft
        name: draft
        label: Draft
        widget: boolean
        default: false
        required: false
        i18n: duplicate
        hint: "On: hidden from the site. Turn on and publish to take a live post down; turn off and publish to bring it back."
      - &section
        name: section
        label: Section
        widget: select
        i18n: duplicate
        default: notes
        hint: "The page that lists this note."
        options:
          - { label: Notes, value: notes }
          - { label: Tech, value: tech }
          - { label: Yoga, value: yoga }
      # Labels for each tag in both languages live in src/components/notes.js
      # (tagLabels); a tag added here without one shows as written.
      - &tags
        name: tags
        label: Tags
        widget: select
        multiple: true
        required: false
        i18n: duplicate
        options: [yoga, meditation, ai, tools, travel, habits, health, books, society]
      - &body
        name: body
        label: Body
        widget: richtext
        i18n: true
        required: false

  - <<: *notes
    name: tech
    label: Tech
    label_singular: Tech post
    description: Listed on micazev.com/tech/.
    filter: { field: section, value: tech }
    fields: [*title, *date, *draft, { <<: *section, default: tech }, *tags, *body]

  - <<: *notes
    name: yoga
    label: Yoga
    label_singular: Yoga post
    description: Listed on micazev.com/yoga/.
    filter: { field: section, value: yoga }
    fields: [*title, *date, *draft, { <<: *section, default: yoga }, *tags, *body]

  - name: pages
    label: Pages
    label_singular: Page
    description: Standalone pages at micazev.com/<slug>/. notes, tech, yoga and admin are taken.
    folder: pages
    extension: md
    format: frontmatter
    create: true
    i18n: true
    slug:
      template: "{{title}}"
      editable: [create]
      pattern: ["^(?!(notes|notas|tech|yoga|ebooks|api|admin|404)$)[a-z0-9-]+$", "Lowercase letters, numbers and dashes; not notes, tech, yoga or admin."]
    media_folder: images
    public_folder: images
    preview_path: /{{slug}}/
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
        required: false
      - *draft
      - name: body
        label: Body
        widget: richtext
        i18n: true
        required: false

  # One JSON file per ebook: ebooks/<slug>.json, with the PDF and cover in
  # ebooks/files/. The build publishes each one at /ebooks/<slug>.pdf
  # (src/lib/ebooks.cjs); which one /yoga offers is set under
  # Site copy -> /yoga page.
  - name: ebooks
    label: Ebooks
    label_singular: Ebook
    description: >-
      PDFs to give away. Choose the one the /yoga signup form hands out under
      Site copy → /yoga page. Emails collected: micazev.com/admin/subscribers/
    folder: ebooks
    extension: json
    format: json
    create: true
    delete: true
    i18n: false
    # The slug is the download address (/ebooks/<slug>.pdf) that emails
    # already sent link to, so it is set once; rename by editing the title.
    slug:
      template: "{{title}}"
      editable: [create]
    media_folder: files
    public_folder: files
    summary: "{{title}} · {{language}}"
    sortable_fields: [title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text, required: false, hint: "Shown under the title on /yoga." }
      - name: language
        label: Language of the ebook
        widget: select
        default: pt
        options:
          - { label: Portuguese, value: pt }
          - { label: English, value: en }
      - name: file
        label: PDF
        widget: file
        accept: application/pdf
        hint: "Upload a new PDF here to replace this one. Keep it under ~20 MB."
      - { name: cover, label: Cover image, widget: image, required: false, hint: "Portrait, about 640 px wide." }

  # Current projects on /tech, one JSON file each: projects/<slug>.json, with
  # the screenshot in projects/images/. The build publishes it at
  # /projects/<slug>.<ext> (src/lib/projects.cjs). Two per row on the page.
  - name: projects
    label: Projects
    label_singular: Project
    description: Current projects on micazev.com/tech/, two per row.
    folder: projects
    extension: json
    format: json
    create: true
    delete: true
    i18n: false
    slug:
      template: "{{name}}"
      editable: [create]
    media_folder: images
    public_folder: images
    summary: "{{order}} · {{name}}"
    sortable_fields: [order, name]
    fields:
      - { name: name, label: Name, widget: string }
      - { name: href, label: URL, widget: string, required: false, hint: "e.g. https://moradiah.com" }
      - { name: order, label: Order, widget: number, value_type: int, required: false, hint: "1 shows first. Projects without a number go last." }
      - { name: image, label: Screenshot, widget: image, required: false, hint: "Shown at 16:10, cropped from the top-left corner. About 2000 px wide." }
      - { name: imageAlt, label: Screenshot description, widget: text, required: false, hint: "What the screenshot shows, for screen readers." }
      - &socials
        name: socials
        label: Social links
        label_singular: Link
        widget: list
        required: false
        summary: "{{fields.label}}"
        fields:
          - { name: label, label: Label, widget: string }
          - name: icon
            label: Icon
            widget: select
            options: [tiktok, instagram, threads, x, pinterest, substack, linkedin, letterboxd, goodreads, youtube, facebook]
          - { name: href, label: URL, widget: string }

  - name: site
    label: Site copy
    i18n: false
    files:
      - name: tech
        label: /tech page
        file: site/tech.json
        format: json
        fields:
          - name: bio
            label: Bio
            label_singular: Paragraph
            widget: list
            field: { name: paragraph, label: Paragraph, widget: text }
          - { name: email, label: Email, widget: string }
          - { name: availability, label: Availability, widget: string, hint: "Next to the green dot" }
          - name: experience
            label: Past work
            label_singular: Job
            widget: list
            summary: "{{fields.company}} · {{fields.years}}"
            fields:
              - { name: company, label: Company, widget: string }
              - { name: years, label: Years, widget: string, hint: "e.g. 2022 - 2024" }
              - { name: description, label: Description, widget: text }
          - { name: timeZone, label: Time zone, widget: string, hint: "IANA name, e.g. Asia/Ho_Chi_Minh" }
          - { name: timeZoneAbbr, label: Time zone abbreviation, widget: string }
          - name: quote
            label: Quote
            widget: object
            fields:
              - { name: text, label: Text, widget: text }
              - { name: author, label: Author, widget: string }
              - { name: source, label: Source, widget: string }

      - name: yoga
        label: /yoga page
        file: site/yoga.json
        format: json
        fields:
          - name: ebook
            label: Active ebook
            widget: relation
            collection: ebooks
            value_field: "{{slug}}"
            search_fields: [title]
            display_fields: [title]
            required: false
            hint: "The ebook the signup form hands out. Leave empty to hide the form."
          - &yoga_copy
            name: en
            label: English
            widget: object
            # All optional: src/templates/yoga.js fills an empty field with
            # its built-in default text.
            fields:
              - { name: blurb, label: Intro, widget: text, required: false, hint: "Leave empty for the default: Notes on yoga's history, texts and practice." }
              - { name: offerLabel, label: Offer label, widget: string, required: false, hint: "Small caps above the ebook title, e.g. Free ebook" }
              - { name: offerCopy, label: Offer text, widget: text, required: false, hint: "Above the email field" }
              - { name: button, label: Button, widget: string, required: false }
              - { name: success, label: After signing up, widget: text, required: false }
              - { name: postsLabel, label: Notes list label, widget: string, required: false }
          - <<: *yoga_copy
            name: pt
            label: Portuguese

      - name: socials
        label: Footer socials
        file: site/site.json
        format: json
        fields:
          - *socials
