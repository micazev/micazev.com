# Sveltia CMS — https://sveltiacms.app/en/docs
#
# Everything here edits github.com/micazev/micazev-content, the private repo
# mounted at content/. Each save is a commit to its main branch; a workflow
# there calls the Vercel deploy hook, and the site rebuilds from that main.

backend:
  name: github
  repo: micazev/micazev-content
  branch: main

site_url: https://micazev.com
display_url: https://micazev.com

# Only the Site copy files use these; notes and pages keep their images next
# to the entry (see media_folder on each collection).
media_folder: images
public_folder: /images

# One file per language: notes/<slug>.en.md, notes/<slug>.pt.md.
# src/components/note-html.cjs reads the same layout back.
i18n:
  structure: multiple_files
  locales: [en, pt]
  default_locale: en
  # Lets a note be published in English only: untick Portuguese in the editor.
  initial_locales: all

collections:
  - name: notes
    label: Notes
    label_singular: Note
    folder: notes
    extension: md
    format: frontmatter
    create: true
    i18n: true
    # The slug is the file name and the URL (/notes/<slug>/). Editable when
    # the note is created, then fixed, so published links don't break.
    slug:
      template: "{{title}}"
      editable: [create]
    media_folder: images
    public_folder: images
    preview_path: /notes/{{slug}}/
    summary: "{{title}} · {{date}}"
    sortable_fields: [date, title]
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
        required: [en]
      - name: date
        label: Date
        widget: datetime
        type: date
        format: YYYY-MM-DD
        default: "{{now}}"
        i18n: duplicate
      # Labels for each tag in both languages live in src/components/notes.js
      # (tagLabels); a tag added here without one shows as written.
      - name: tags
        label: Tags
        widget: select
        multiple: true
        required: false
        i18n: duplicate
        options: [yoga, meditation, ai, tools, travel, habits, health, books, society]
      - name: body
        label: Body
        widget: richtext
        i18n: true
        required: [en]

  - name: pages
    label: Pages
    label_singular: Page
    description: Standalone pages at micazev.com/<slug>/. notes, tech, yoga and admin are taken.
    folder: pages
    extension: md
    format: frontmatter
    create: true
    i18n: true
    slug:
      template: "{{title}}"
      editable: [create]
      pattern: ["^(?!(notes|notas|tech|yoga|ebooks|api|admin|404)$)[a-z0-9-]+$", "Lowercase letters, numbers and dashes; not notes, tech, yoga or admin."]
    media_folder: images
    public_folder: images
    preview_path: /{{slug}}/
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
        required: [en]
      - name: body
        label: Body
        widget: richtext
        i18n: true
        required: [en]

  # One JSON file per ebook: ebooks/<slug>.json, with the PDF and cover in
  # ebooks/files/. The build publishes each one at /ebooks/<slug>.pdf
  # (src/lib/ebooks.cjs); which one /yoga offers is set under
  # Site copy -> /yoga page.
  - name: ebooks
    label: Ebooks
    label_singular: Ebook
    description: >-
      PDFs to give away. Choose the one the /yoga signup form hands out under
      Site copy → /yoga page. Emails collected: micazev.com/admin/subscribers/
    folder: ebooks
    extension: json
    format: json
    create: true
    delete: true
    i18n: false
    # The slug is the download address (/ebooks/<slug>.pdf) that emails
    # already sent link to, so it is set once; rename by editing the title.
    slug:
      template: "{{title}}"
      editable: [create]
    media_folder: files
    public_folder: files
    summary: "{{title}} · {{language}}"
    sortable_fields: [title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text, required: false, hint: "Shown under the title on /yoga." }
      - name: language
        label: Language of the ebook
        widget: select
        default: pt
        options:
          - { label: Portuguese, value: pt }
          - { label: English, value: en }
      - name: file
        label: PDF
        widget: file
        accept: application/pdf
        hint: "Upload a new PDF here to replace this one. Keep it under ~20 MB."
      - { name: cover, label: Cover image, widget: image, required: false, hint: "Portrait, about 640 px wide." }

  - name: site
    label: Site copy
    i18n: false
    files:
      - name: tech
        label: /tech page
        file: site/tech.json
        format: json
        fields:
          - name: bio
            label: Bio
            label_singular: Paragraph
            widget: list
            field: { name: paragraph, label: Paragraph, widget: text }
          - { name: email, label: Email, widget: string }
          - { name: availability, label: Availability, widget: string, hint: "Next to the green dot" }
          - name: projects
            label: Current projects
            label_singular: Project
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: Name, widget: string }
              - { name: href, label: URL, widget: string }
              - &socials
                name: socials
                label: Social links
                label_singular: Link
                widget: list
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: Label, widget: string }
                  - name: icon
                    label: Icon
                    widget: select
                    options: [tiktok, instagram, threads, x, pinterest, substack, linkedin, letterboxd, goodreads, youtube]
                  - { name: href, label: URL, widget: string }
          - name: experience
            label: Past work
            label_singular: Job
            widget: list
            summary: "{{fields.company}} · {{fields.years}}"
            fields:
              - { name: company, label: Company, widget: string }
              - { name: years, label: Years, widget: string, hint: "e.g. 2022 - 2024" }
              - { name: description, label: Description, widget: text }
          - { name: timeZone, label: Time zone, widget: string, hint: "IANA name, e.g. Asia/Ho_Chi_Minh" }
          - { name: timeZoneAbbr, label: Time zone abbreviation, widget: string }
          - name: quote
            label: Quote
            widget: object
            fields:
              - { name: text, label: Text, widget: text }
              - { name: author, label: Author, widget: string }
              - { name: source, label: Source, widget: string }

      - name: yoga
        label: /yoga page
        file: site/yoga.json
        format: json
        fields:
          - name: ebook
            label: Active ebook
            widget: relation
            collection: ebooks
            value_field: "{{slug}}"
            search_fields: [title]
            display_fields: [title]
            required: false
            hint: "The ebook the signup form hands out. Leave empty to hide the form."
          - &yoga_copy
            name: en
            label: English
            widget: object
            # All optional: src/templates/yoga.js fills an empty field with
            # its built-in default text.
            fields:
              - { name: blurb, label: Intro, widget: text, required: false, hint: "Leave empty for the default: Notes on yoga's history, texts and practice." }
              - { name: offerLabel, label: Offer label, widget: string, required: false, hint: "Small caps above the ebook title, e.g. Free ebook" }
              - { name: offerCopy, label: Offer text, widget: text, required: false, hint: "Above the email field" }
              - { name: button, label: Button, widget: string, required: false }
              - { name: success, label: After signing up, widget: text, required: false }
              - { name: postsLabel, label: Notes list label, widget: string, required: false }
          - <<: *yoga_copy
            name: pt
            label: Portuguese

      - name: socials
        label: Footer socials
        file: site/site.json
        format: json
        fields:
          - *socials
